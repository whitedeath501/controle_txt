<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Controle de Registros em Arquivo TXT - Estudo</title>
<link rel="stylesheet" href="estiloso.css">


</head>
<body>
<div class="container">
<h1>Controle de Registros em Arquivo TXT</h1>
<p>Formato do arquivo: cada linha é um registro, campos separados por vírgula (CSV simples).<br>
Exemplo: <code>1,Ana Silva,ana@email.com,11 99999-9999</code></p>

<label> Ler arquivo CSV (file input): </label>
<input type="file" id="fileInput" accept=".csv">

<label> Ou informar dados manualmente (uma linha por registro, CSV): </label>
<textarea id="dadosTexto" rows="5" placeholder="Ex: 1,Ana Silva,ana@email.com,11 99999-9999&#10;2,Bruno Costa,bruno@email.com,11 88888-8888"></textarea>

<label> Campo de busca: </label>
<input type="text" id="campoBusca" placeholder="Buscar por nome, email, telefone ou ID">

<label> Ordenar por campo (0=ID, 1=Nome, 2=Email, 3=Telefone): </label>
<input type="number" id="campoOrdenar" min="0" max="3" value="0" style="width:80px;">
<button id="btOrdenar">Ordenar</button>

<label> Exportar como: </label>
<select id="formatoExportar">
<option value="txt">TXT (uma linha por registro)</option>
<option value="csv">CSV</option>
</select>
<button id="btExportar">Exportar / Salvar</button>

<div style="margin-top:15px;">
<button id="btCarregar">Carregar arquivo</button>
<button id="btSalvarMemoria">Salvar (download .txt)</button>
<button id="btListar">Listar todos</button>
<button id="btBuscar">Buscar</button>
<button id="btOrdenarLista">Ordenar lista atual</button>
<button id="btLimpar">Limpar dados</button>
<button id="btExcluirSelecionado" class="danger">Excluir selecionado</button>
</div>

<div id="resultado">
<h3>Resultado</h3>
<div id="resultadoContent">Nenhum dado carregado.</div>
<table id="tabela" style="display:none;">
<thead>
<tr><th>#</th><th>ID</th><th>Nome</th><th>Email</th><th>Telefone</th><th>Ações</th></tr>
</thead>
<tbody id="tabelaBody"></tbody>
</table>
</div>

<div id="mensagem"></div>

<script type="text/javascript" src="cerebro.js"></script>

</body>
</html>
